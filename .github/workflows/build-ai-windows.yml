name: Build SimulIDE AI for Windows
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test launch/update/data selection and package isolation
        shell: powershell
        run: ./tests/windows/launcher-tests.ps1
      - name: Build using the same bootstrap as ZAZENI.cmd
        shell: powershell
        run: ./scripts/zazeni.ps1 -BuildOnly
      - name: Check no-change launch and changed-source rebuild
        shell: powershell
        run: |
          $binary = 'build_AI/executables/SimulIDE_2.0.0-/simulide.exe'
          $before = (Get-Item $binary).LastWriteTimeUtc
          ./scripts/zazeni.ps1 -BuildOnly
          if ((Get-Item $binary).LastWriteTimeUtc -ne $before) { throw 'Nespremenjena koda se je ponovno gradila.' }
          $sourceTime = (Get-Item src/main.cpp).LastWriteTimeUtc
          Add-Content src/main.cpp "`n// CI rebuild probe with preserved source timestamp"
          (Get-Item src/main.cpp).LastWriteTimeUtc = $sourceTime
          ./scripts/zazeni.ps1 -BuildOnly
          if ((Get-Item $binary).LastWriteTimeUtc -le $before) { throw 'Spremenjena koda ni bila ponovno prevedena.' }
          # Undo only this CI probe, then package the original checked-out revision.
          git restore -- src/main.cpp
          ./scripts/zazeni.ps1 -BuildOnly
      - name: Create portable student ZIP
        shell: powershell
        run: ./scripts/package-windows.ps1
      - name: Launch the extracted portable ZIP through ZAZENI.cmd
        shell: powershell
        run: |
          Expand-Archive -LiteralPath dist/SimulIDE-AI-Windows.zip -DestinationPath dist/portable-smoke -Force
          ./tests/windows/portable-smoke.ps1 -PackageRoot (Join-Path $pwd 'dist/portable-smoke')
      - uses: actions/upload-artifact@v4
        with:
          name: SimulIDE-AI-Windows
          path: dist/SimulIDE-AI-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-setup-log
          path: setup.log
